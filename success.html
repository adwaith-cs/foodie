<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodie - Order Successful</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <span class="logo-icon">
                    🍴
                </span>

                Foodie

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

            </nav>

        </div>

    </header>



    <!-- SUCCESS -->

    <main class="success-page">

        <div class="success-card">


            <div class="success-icon">

                ✓

            </div>


            <h1>
                Order Confirmed!
            </h1>


            <p>
                Thank you for ordering with Foodie.
            </p>


            <p>
                Your delicious food is being prepared.
            </p>


            <div class="order-number">

                Order ID:
                <span id="orderNumber">
                    FD000000
                </span>

            </div>


            <div class="delivery-details">

                <h3>
                    Delivery Details
                </h3>

                <p>
                    <strong>Name:</strong>
                    <span id="successName">
                    </span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span id="successPhone">
                    </span>
                </p>

                <p>
                    <strong>Address:</strong>
                    <span id="successAddress">
                    </span>
                </p>

            </div>


            <a
                href="menu.html"
                class="primary-btn">

                Order More Food

            </a>

        </div>

    </main>



    <script src="script.js"></script>

</body>

</html>
