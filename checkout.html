<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodie - Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <span class="logo-icon">
                    🍴
                </span>

                Foodie

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="cart.html">
                    🛒 Cart
                </a>

            </nav>

        </div>

    </header>



    <!-- CHECKOUT -->

    <main class="checkout-page">

        <div class="container">

            <h1>
                Checkout
            </h1>


            <div class="checkout-layout">


                <!-- CUSTOMER DETAILS -->

                <div class="checkout-form">

                    <h2>
                        Delivery Details
                    </h2>


                    <form
                        id="checkoutForm"
                        onsubmit="placeOrder(event)">


                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="customerName"
                                placeholder="Enter your name"
                                required>

                        </div>



                        <div class="form-row">

                            <div class="form-group">

                                <label>
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="customerPhone"
                                    placeholder="9876543210"
                                    required>

                            </div>


                            <div class="form-group">

                                <label>
                                    PIN Code
                                </label>

                                <input
                                    type="text"
                                    id="customerPin"
                                    placeholder="680000"
                                    required>

                            </div>

                        </div>



                        <div class="form-group">

                            <label>
                                Delivery Address
                            </label>

                            <textarea
                                id="customerAddress"
                                placeholder="House name, street, city..."
                                required></textarea>

                        </div>



                        <h2>
                            Payment Method
                        </h2>


                        <div class="payment-options">


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Cash on Delivery"
                                    checked>

                                <span>
                                    💵
                                    <strong>
                                        Cash on Delivery
                                    </strong>
                                </span>

                            </label>



                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="UPI">

                                <span>
                                    📱
                                    <strong>
                                        UPI
                                    </strong>
                                </span>

                            </label>



                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Card">

                                <span>
                                    💳
                                    <strong>
                                        Credit / Debit Card
                                    </strong>
                                </span>

                            </label>

                        </div>


                        <button
                            type="submit"
                            class="checkout-btn">

                            Place Order

                        </button>

                    </form>

                </div>



                <!-- ORDER SUMMARY -->

                <div class="order-summary">

                    <h2>
                        Your Order
                    </h2>


                    <div id="checkoutItems">
                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="checkoutSubtotal">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <span id="checkoutDelivery">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Tax
                        </span>

                        <span id="checkoutTax">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="checkoutTotal">
                            ₹0.00
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
