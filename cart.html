<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodie - Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <span class="logo-icon">🍴</span>

                Foodie

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="cart.html" class="cart-link">

                    🛒 Cart

                    <span class="cart-count">
                        0
                    </span>

                </a>

            </nav>

        </div>

    </header>



    <!-- CART -->

    <main class="cart-page">

        <div class="container">

            <h1>
                Your Cart
            </h1>


            <div class="cart-layout">


                <!-- CART ITEMS -->

                <div
                    class="cart-items"
                    id="cartItems">

                </div>



                <!-- SUMMARY -->

                <div class="cart-summary">

                    <h2>
                        Order Summary
                    </h2>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="subtotal">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery Fee
                        </span>

                        <span id="delivery">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Tax (5%)
                        </span>

                        <span id="tax">
                            ₹0.00
                        </span>

                    </div>


                    <!-- COUPON -->

                    <div class="coupon">

                        <input
                            type="text"
                            id="couponInput"
                            placeholder="Coupon code">

                        <button onclick="applyCoupon()">
                            Apply
                        </button>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            ₹0.00
                        </span>

                    </div>


                    <button
                        class="checkout-btn"
                        onclick="goToCheckout()">

                        Proceed to Checkout

                    </button>

                </div>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container footer-bottom">

            © 2026 Foodie. All rights reserved.

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
